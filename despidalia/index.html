<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal bajas de personal Latinoamerica · Simulador Demo Day</title>
<style>
/* El sistema real solo tiene modo claro; el simulador lo replica tal cual. */
:root{
  color-scheme:light;
  --pri:#4f98ca; --pri-d:#3d86b9; --pri-l:#e9f3fa; --pri-ll:#f4f9fd;
  --ink:#1f2937; --ink2:#6b7280; --ink3:#9ca3af; --line:#e3e8ee; --field:#f2f4f7;
  --green:#22b84d; --green-l:#e8f8ed; --red:#c8202f; --gray-pill:#8e98a5;
  --bg:#f6f8fb; --white:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #edf1f5}
.logo{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:#26313d}
.logo svg{width:28px;height:14px}
.hdr .grow{flex:1}
.hdate{display:flex;align-items:center;gap:6px;font-size:11px;color:#4b5563}
.hdate svg{width:13px;height:13px}
.bellbtn{position:relative;border:0;background:none;padding:4px;color:#4b5563;display:flex}
.bellbtn .b{position:absolute;top:-1px;right:-3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--pri);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.uchip{display:flex;align-items:center;gap:8px;border:0;background:#f3f6f9;border-radius:22px;padding:3px 10px 3px 3px}
.av{width:26px;height:26px;border-radius:50%;background:var(--pri-l);border:1px solid #c9def0;color:var(--pri);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.uchip .t{text-align:left;line-height:1.15}
.uchip .t b{display:block;font-size:11px;font-weight:700;color:#26313d}
.uchip .t small{font-size:9px;color:#6b7280;text-transform:uppercase}
.uchip svg{width:12px;height:12px;color:#9ca3af}

/* dropdowns */
.drop{position:absolute;z-index:40;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(30,50,80,.18);border:1px solid #edf1f5}
.umenu{top:50px;right:14px;width:250px;padding:12px}
.umenu .me{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.umenu .me .av{width:34px;height:34px;font-size:12px}
.umenu .me b{display:block;font-size:12px}
.umenu .me small{font-size:10px;color:var(--pri);text-transform:uppercase;font-weight:600}
.umenu h6{margin:12px 0 6px;font-size:9.5px;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.umenu .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px}
.umenu .row b{display:block;font-size:11.5px;font-weight:600}
.umenu .row small{font-size:10px;color:#9ca3af}
.umenu .row .tg{margin-left:auto;width:30px;height:16px;border-radius:9px;background:#f1f1f1;border:1px solid #e5e5e5;position:relative}
.umenu .row .tg::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#f5c542}
.umenu button.row{width:100%;border:0;background:none;text-align:left}
.umenu button.row:hover{background:#fdf2f3}
.umenu .logout b{color:var(--red)}
.umenu .logout svg{color:var(--red)}
.npanel{top:50px;right:110px;width:300px;padding:12px 0 10px}
.npanel .h{padding:0 14px 10px;border-bottom:1px solid var(--line);position:relative}
.npanel .h b{font-size:13px}
.npanel .h .cnt{display:inline-flex;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--pri-l);color:var(--pri);font-size:10px;font-weight:700;align-items:center;justify-content:center;padding:0 5px}
.npanel .h small{display:block;font-size:10px;color:var(--ink2);margin-top:2px}
.npanel .h .x{position:absolute;right:12px;top:0;border:0;background:none;color:#6b7280}
.npanel .tabs{margin-top:8px}
.npanel .tab{display:inline-flex;gap:5px;align-items:center;font-size:10.5px;font-weight:600;color:var(--pri);background:var(--pri-l);border:1px solid #cfe3f3;border-radius:14px;padding:3px 10px}
.npanel .tab svg{width:11px;height:11px}
.nlist{padding:8px 10px;max-height:340px;overflow:auto}
.nitem{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff}
.nitem.open{background:#f4f9fd;border-color:#cfe3f3}
.nitem .top{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.nitem .ic{width:24px;height:24px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.nitem .ic svg{width:12px;height:12px}
.nitem .tags{display:flex;gap:6px;align-items:center}
.nitem .tag{font-size:10px;color:var(--pri);background:var(--pri-l);border-radius:10px;padding:1px 7px;font-weight:600}
.nitem .st{font-size:9px;color:#9ca3af;display:flex;align-items:center;gap:3px}
.nitem .st::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--pri)}
.nitem .f{font-size:11px;font-weight:700;margin-top:4px}
.nitem .e{font-size:9.5px;color:#6b7280;display:flex;gap:4px;align-items:center;margin-top:1px}
.nitem .e svg{width:10px;height:10px}
.nitem .chev{margin-left:auto;color:#9ca3af}
.nitem .chev svg{width:12px;height:12px}
.nitem .more{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:10.5px}
.nitem .more small{display:flex;gap:4px;align-items:center;font-size:9px;color:#9ca3af;margin-bottom:6px}
.nitem .more small svg{width:10px;height:10px}
.nitem .more p{margin:3px 0}
.nitem .more b{font-weight:700}
.nitem .vm{display:block;margin:8px auto 0;border:0;background:var(--pri-l);color:var(--pri);font-size:10.5px;font-weight:600;border-radius:12px;padding:4px 16px}
.nempty{padding:24px 14px;text-align:center;color:var(--ink3);font-size:11px}

/* ---------- login ---------- */
.login{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 0 0,#eef3fb 0,transparent 30%),radial-gradient(circle at 100% 100%,#f0ecfb 0,transparent 25%),#fafbfc}
.lcard{width:300px;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(30,50,80,.10);overflow:hidden}
.lcard .top{background:linear-gradient(120deg,#4f98ca,#7cb6dd);color:#fff;padding:16px 16px 18px;display:flex;gap:12px}
.lcard .top .lk{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.lcard .top b{font-size:16px;font-weight:700}
.lcard .top p{margin:3px 0 0;font-size:11px;line-height:1.5}
.lcard .bd{padding:16px}
.lcard .sec{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfc}
.lcard .sec small{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--pri);text-transform:uppercase}
.lcard .sec span{font-size:11px}
.lcard .in{margin-top:14px;display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:36px}
.lcard .in span{color:#9ca3af}
.lcard .in input{border:0;outline:0;flex:1;font-size:12px;height:100%}
.lcard .go{margin-top:10px;width:100%;height:34px;border:0;border-radius:6px;background:var(--pri);color:#1f2937;font-weight:600;font-size:12px;box-shadow:0 3px 10px rgba(79,152,202,.35)}
.lcard .go:hover{background:#5ea4d3}
.lcard .ft{margin-top:14px;text-align:center;font-size:9.5px;color:var(--ink2)}
.ctry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s,box-shadow .15s}
.cbtn:hover{border-color:#9cc5e3;box-shadow:0 4px 14px rgba(79,152,202,.18)}
.cbtn svg{width:54px;height:36px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cbtn b{font-size:12px}
.cbtn small{font-size:9.5px;color:var(--ink3)}
.cbtn small.pn{color:#fff;background:var(--pri);border-radius:8px;padding:1px 8px}
.umenu .mflag svg{width:20px;height:14px;border-radius:2px;box-shadow:0 0 0 1px #e5e7eb;display:block}
.wel .card.hn{background:linear-gradient(180deg,rgba(196,236,248,.9) 0 33.3%,rgba(255,255,255,.94) 33.3% 66.6%,rgba(222,244,251,.92) 66.6%)}
.lcard .err{margin-top:8px;font-size:11px;color:var(--red)}

/* ---------- home ---------- */
.home{position:relative;min-height:calc(100vh - 46px);overflow:hidden;padding:30px 18px 60px}
.waves{position:absolute;inset:0;z-index:0;pointer-events:none}
.home>*:not(.waves){position:relative;z-index:1}
.wel{max-width:420px;margin:30px auto 0;position:relative}
.wel .bigav{position:absolute;left:50%;top:-28px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#e4eff8;border:1.5px solid #bcd7ec;color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 4px 14px rgba(79,152,202,.2)}
.wel .card{border-radius:8px;border-top:3px solid #9fc7e6;background:linear-gradient(90deg,rgba(205,227,244,.85) 0 33.3%,rgba(255,255,255,.92) 33.3% 66.6%,rgba(235,244,251,.9) 66.6%);box-shadow:0 8px 26px rgba(30,50,80,.12);padding:28px 18px 16px;text-align:center;position:relative;overflow:hidden}
.wel .emblem{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-44%);opacity:.12;color:#8a7a3a}
.wel .country{position:absolute;left:10px;top:8px;display:flex;gap:5px;align-items:center;background:#fff;border-radius:12px;padding:3px 9px;font-size:9.5px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.wel .country svg{width:11px;height:11px;color:var(--pri)}
.wel h2{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.wel h2 .hi{width:20px;height:20px;border-radius:50%;background:#e9f2f9;color:var(--pri);display:flex;align-items:center;justify-content:center}
.wel h2 .hi svg{width:11px;height:11px}
.wel h2 em{font-style:normal;color:var(--pri)}
.wel .pend{display:inline-block;margin-top:6px;font-size:9.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 9px;position:relative}
.wel .pend b{color:var(--pri);font-weight:600}
.wel p{margin:8px 0 12px;font-size:9.5px;color:var(--ink2);position:relative}
.wel .bchip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:56%;text-align:left;position:relative}
.wel .bchip .ic{width:22px;height:22px;border-radius:6px;background:#eef3f8;color:#7b8794;display:flex;align-items:center;justify-content:center}
.wel .bchip .ic svg{width:12px;height:12px}
.wel .bchip b{display:block;font-size:10.5px;font-weight:600}
.wel .bchip small{font-size:9px;color:var(--ink2)}
.wel .bchip .n{margin-left:auto;background:var(--pri);color:#fff;font-size:9.5px;font-weight:700;border-radius:6px;padding:2px 10px}
.mods{max-width:700px;margin:26px auto 0;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:10px;box-shadow:0 6px 24px rgba(30,50,80,.06);backdrop-filter:blur(4px)}
.mods .bar{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:10px;font-weight:600}
.pill svg{width:11px;height:11px}
.pill .c{font-size:9px;color:#6b7280;margin-left:2px}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill.on .c{color:#fff;opacity:.85}
.pill.on svg{opacity:.9}
.mods .q{margin-left:auto;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 8px;height:26px;width:170px}
.mods .q svg{width:11px;height:11px;color:#9ca3af}
.mods .q input{border:0;outline:0;font-size:10px;width:100%}
.mods .grid{background:#fff;border-radius:8px;min-height:140px;padding:12px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,190px));gap:12px;align-content:start}
.mcard{position:relative;border-radius:6px;border-top:3px solid #8cbde0;background:#fff;box-shadow:0 2px 10px rgba(30,50,80,.10);padding:10px 10px 8px;text-align:left;border-left:0;border-right:0;border-bottom:0;overflow:hidden}
.mcard::after{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:linear-gradient(225deg,#eef5fb 50%,transparent 50%)}
.mcard:hover{box-shadow:0 6px 18px rgba(30,50,80,.16)}
.mcard .r{display:flex;gap:8px}
.mcard .ic{width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.mcard .ic svg{width:12px;height:12px}
.mcard b{display:block;font-size:10.5px;font-weight:600}
.mcard small{display:block;font-size:8.5px;color:var(--ink2)}
.mcard .acc{margin-top:14px;font-size:7.5px;color:#9ca3af}
.mcard .fav{position:absolute;right:6px;top:6px;z-index:1;border:0;background:none;padding:0;color:#4b5563}
.mcard .fav svg{width:12px;height:12px}
.mcard .fav.on svg{fill:#f5c542;color:#e0a800}
.emptymods{grid-column:1/-1;text-align:center;color:var(--ink3);font-size:11px;padding:40px 0}

/* ---------- module layout ---------- */
.mod{display:flex;gap:10px;padding:8px 8px 0;min-height:calc(100vh - 46px);background:linear-gradient(180deg,#e8f0f8 0,#f6f8fb 70px)}
.side{width:76px;flex:none;background:#fff;border:1px solid #cfe1ef;border-top:3px solid var(--pri);border-radius:6px 6px 0 0;padding:8px 6px;text-align:center}
.side.wide{width:152px}
.side h3{margin:0;font-size:11px;color:var(--pri);font-weight:700;line-height:1.25}
.side .d{font-size:8.5px;color:var(--ink);margin:4px 0 0;line-height:1.35}
.side .q{margin:8px 0 12px;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;padding:0 5px;height:18px;background:#fafbfc}
.side .q svg{width:9px;height:9px;color:#9ca3af}
.side .q input{border:0;outline:0;width:100%;font-size:8.5px;background:transparent}
.tile{position:relative;display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px 7px;margin-bottom:8px}
.tile .ic{width:40px;height:38px;border-radius:8px;margin:0 auto;background:#f2f4f7;display:flex;align-items:center;justify-content:center;color:#2b3440}
.tile .ic svg{width:20px;height:20px}
.tile span{display:block;margin-top:5px;font-size:7.5px;font-weight:600;color:#26313d;line-height:1.25}
.tile .fv{position:absolute;right:4px;top:4px;color:#26313d}
.tile .fv svg{width:10px;height:10px}
.tile.on{border-color:#a9cde8;box-shadow:0 0 0 1px #d6e8f5}
.tile.on .ic{background:#e4eff8;color:var(--pri)}
.tile.on span{color:var(--pri)}
.side.wide .tile{display:flex;align-items:center;gap:8px;text-align:left;padding:8px}
.side.wide .tile .ic{width:26px;height:26px;margin:0;background:#fff}
.side.wide .tile .ic svg{width:15px;height:15px}
.side.wide .tile span{margin:0;font-size:8.5px;flex:1}
.side.wide .tile .fv{position:static;border:1px solid var(--line);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.main{flex:1;min-width:0;background:#fff;border:1px solid #e1e9f1;border-top:3px solid var(--pri);border-radius:6px 6px 0 0;padding:0 8px 30px}
.mh{display:flex;align-items:center;gap:10px;padding:10px 6px 8px;border-bottom:2px solid var(--pri)}
.mh .g{color:var(--pri)}
.mh .g svg{width:13px;height:13px}
.mh b{display:block;font-size:12px;font-weight:600}
.mh small{display:block;font-size:9px;color:var(--ink2)}
.mh .hb{margin-left:auto;width:26px;height:26px;border-radius:6px;border:0;background:#e7eef5;color:#26313d;display:flex;align-items:center;justify-content:center}
.mh .hb svg{width:13px;height:13px}

/* stepper */
.stp{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 6px 6px;position:relative}
.stp .s{width:90px;text-align:center;position:relative;z-index:1}
.stp .s:first-child{text-align:left}
.stp .s:last-child{text-align:right}
.stp .dot{width:20px;height:20px;border-radius:50%;border:1px solid #d6dbe1;background:#fff;color:#c0c6cd;display:inline-flex;align-items:center;justify-content:center}
.stp .dot svg{width:10px;height:10px}
.stp .s.done .dot{background:var(--pri);border-color:var(--pri);color:#fff}
.stp .s.done .dot svg{stroke-width:3.2}
.stp .s.cur .dot{width:28px;height:28px;border:2px solid var(--pri);color:var(--pri);background:#eef6fc;box-shadow:0 0 0 3px #fff,0 0 0 4px #cfe3f3;margin-top:-4px}
.stp .s.cur .dot svg{width:14px;height:14px}
.stp .s small{display:block;font-size:6.5px;font-weight:700;color:#9ca3af;margin-top:4px;letter-spacing:.04em}
.stp .s.cur small,.stp .s.done small{color:#6b7280}
.stp .s.cur small{color:var(--pri)}
.stp .s b{display:block;font-size:7.5px;font-weight:700;color:#9ca3af}
.stp .s.cur b,.stp .s.done b{color:#1f2937}
.stp .s span{display:block;font-size:6.5px;color:#a0a7b0;line-height:1.35;margin-top:1px}
.stp .s:first-child span{max-width:90px}
.stp .ln{position:absolute;top:27px;height:2px;background:#e5e8ec;z-index:0}
.stp .ln i{position:absolute;inset:0;background:var(--pri);transition:width .5s ease;width:0}

.wrap{border:1px solid var(--line);border-radius:4px;margin:12px 6px 0;padding:14px 14px 16px;position:relative}
.srch{display:flex;align-items:center;gap:6px}
.srch .f{display:flex;align-items:center;gap:4px;background:var(--field);border-radius:6px;padding:0 8px;height:26px}
.srch .f svg{width:11px;height:11px;color:#9ca3af}
.srch .f input{border:0;outline:0;background:transparent;font-size:10.5px;width:100%}
.sbtn{position:relative;width:26px;height:26px;border-radius:7px;border:0;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(79,152,202,.4)}
.sbtn svg{width:12px;height:12px}
.sbtn .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#26313d;font-size:8.5px;padding:3px 8px;border-radius:5px;box-shadow:0 2px 10px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .15s}
.sbtn:hover .tip,.sbtn:focus-visible .tip{opacity:1}

.clist{margin-top:8px;max-height:250px;overflow:auto;padding-right:2px}

/* pendientes */

.pq input{border:0;outline:0;font-size:9.5px;width:300px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 6px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}

/* ---------- modals ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(80,88,100,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.ov.light{background:rgba(255,255,255,.35)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.mdl{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(20,30,50,.25);animation:pop .18s ease;position:relative;max-width:100%}
.mdl .x{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#6b7280;display:flex;align-items:center;justify-content:center}
.mdl .x svg{width:10px;height:10px}
.loader{width:240px;padding:20px 18px 16px;text-align:center}
.loader .gr{width:56px;height:56px;margin:0 auto;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.loader .gr::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#c9dff0;border-right-color:#c9dff0;animation:spin 1.2s linear infinite}
.loader .gr span{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(79,152,202,.4)}

.loader b{display:block;margin-top:12px;font-size:12px;font-weight:600}
.loader small{display:block;font-size:9px;color:#6b7280;margin-top:3px;line-height:1.4}
.dots{display:flex;gap:3px;justify-content:center;margin-top:9px}
.dots i{width:4px;height:4px;border-radius:50%;background:#9bbfdc;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.cf .bt.one{grid-template-columns:1fr}
.pg{width:300px;padding:18px 12px 12px;text-align:center}
.pg .gr{width:52px;height:52px;margin:0 auto;border-radius:50%;border:4px solid #eef4f8;position:relative;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.pg .gr::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-right-color:var(--pri);animation:spin 1.1s linear infinite}
.pg .gr svg{width:18px;height:18px}
.pg h3{margin:10px 0 0;font-size:11.5px;font-weight:600}
.pg>small{display:block;font-size:8.5px;color:#4b5563;margin-top:4px}

.np{width:300px;padding:18px 16px 14px;text-align:center;overflow:hidden}

.np .bl i{position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:8px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#26313d;color:#fff;font-size:11px;padding:8px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s ease}

.guide ol li{margin-bottom:3px}
.guide ol code{font-family:inherit;font-weight:700;color:#1f2937;background:#eef4fa;border-radius:4px;padding:0 4px}
.prs{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:11px}
.pr:first-child{border-top:0}
.pr .av{width:26px;height:26px;font-size:9px}
.pr .w{flex:1;min-width:0}
.pr .w b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .w small{display:block;font-size:10px;color:var(--ink2)}
.pr .num{font-weight:700;color:var(--pri);font-size:11.5px}
.pr button{border:1px solid #cfe3f3;background:#f4f9fd;color:var(--pri);border-radius:6px;font-size:10.5px;font-weight:600;padding:3px 9px}
.pr button:hover{background:#e4eff8}
.pr.me{background:#f7fbfe}
.pr .tag{font-size:9.5px;border-radius:8px;padding:1px 7px;font-weight:600;white-space:nowrap}
.tag.free{background:#e8f8ed;color:#2f8a4c}
.tag.busy{background:#fff4e5;color:#b45309}
.tag.done{background:#eef0f3;color:#6b7280}
.guide{width:420px}
.case{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.case summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:11px;background:#fafbfc}
.case summary::-webkit-details-marker{display:none}
.case summary b{font-size:11.5px}
.case summary span:not(.flg){color:var(--ink2)}
.case summary em{margin-left:auto;font-style:normal;font-size:10px;color:var(--pri);background:var(--pri-l);border-radius:8px;padding:1px 7px}
.case[open] summary{border-bottom:1px solid var(--line)}
.case .prs{border:0;border-radius:0}
.flg svg{width:20px;height:14px;border-radius:2px;display:block;box-shadow:0 0 0 1px #e5e7eb}
.prs .lbl{font-size:9.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:7px 10px 2px;border-top:1px solid var(--line)}
.prs .lbl:first-child{border-top:0}
.prs .lbl+.pr{border-top:0}
.guide .rst{margin-top:16px;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;border:1px solid #f0d0d4;background:#fff;color:var(--red);border-radius:8px;height:32px;font-size:11.5px;font-weight:600}
.guide .rst:hover{background:#fdf4f5}
.guide .rst svg{width:13px;height:13px}
.guide .note{font-size:10px;color:var(--ink3);margin-top:8px;text-align:center}

@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:0}
  .side{display:none}
  .hdate,.uchip .t{display:none}
  .npanel{right:10px}
  .stp .s span{display:none}
}
</style>

const AF_CAT={
 Laptop:{ic:'brief',m:['Laptop Dell Latitude 5440','Laptop Lenovo ThinkPad E14 Gen 5','Laptop HP ProBook 450 G10'],s:'LT'},
 Computadora:{ic:'receipt',m:['Computadora Dell OptiPlex 7010','Computadora HP EliteDesk 800 G6','Computadora Lenovo ThinkCentre M70q'],s:'PC'},
 Celular:{ic:'hash',m:['Celular Samsung Galaxy A54','Celular Apple iPhone 13','Celular Motorola Moto G84'],s:'CE'},
 'Vehículo':{ic:'store',m:['Vehículo Toyota Hilux 2023','Vehículo Toyota Corolla 2022','Vehículo Mitsubishi Montero Sport 2023'],s:'VH'}
};
const _af={};
function assetsOf(e){
 if(_af[e.id])return _af[e.id];
 let x=(+e.id*2654435761)>>>0;const r=()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
 const dir=/^DIRECTOR/.test(e.puesto);
 let types=[];
 if(dir){types.push('Vehículo');const k=Math.floor(r()*3);const pool=['Laptop','Celular','Computadora'];for(let i=0;i<k;i++)types.push(pool[i])}
 else{const k=Math.floor(r()*4);const pool=['Laptop','Computadora','Celular'].sort(()=>r()-.5);if(k===3){types=['Laptop','Celular',pool.find(t=>t!=='Laptop'&&t!=='Celular')||'Computadora']}else types=pool.slice(0,k)}
 const ini=parseYmd(e.ingreso),span=Math.max(1,now()-ini);
 const L='ABCDEFGHJKLMNPRSTUVWXYZ';
 _af[e.id]=types.map((t,i)=>{const c=AF_CAT[t],dt=new Date(ini.getTime()+r()*span);
  const serie=t==='Vehículo'?(e.pais==='G'?`P-${100+Math.floor(r()*900)}${L[Math.floor(r()*23)]}${L[Math.floor(r()*23)]}${L[Math.floor(r()*23)]}`:`PD${L[Math.floor(r()*23)]} ${1000+Math.floor(r()*9000)}`):`${c.s}${e.pais}${Math.floor(r()*1e8).toString().padStart(8,'0')}`;
  return {tipo:t,ic:c.ic,desc:c.m[Math.floor(r()*c.m.length)],serie,fecha:dmy(dt),no:`AF-${e.pais==='G'?'GT':'HN'}-${(100000+Math.floor(r()*900000))}`}});
 return _af[e.id];
}

function prng(seed){let x=(+seed*2654435761+97)>>>0;return()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

// Salario mensual simulado (acumulados SAP HCM) a partir del puesto; determinístico por empleado.
function baseSal(e){
 const r=prng(+e.id+7)(),p=e.puesto,G=e.pais==='G';
 const R=/^DIRECTOR/.test(p)?(G?[45000,90000]:[120000,250000]):/^GERENTE/.test(p)?(G?[18000,35000]:[50000,110000]):/^(JEFE|COORDINADOR|LIDER|LÍDER|SUPERVISOR|CONSULTOR SR)/.test(p)?(G?[9000,16000]:[25000,45000]):(G?[4200,8500]:[12000,22000]);
 return Math.round((R[0]+(R[1]-R[0])*r)/10)*10;
}
function salHist(e,baja){
 const base=baseSal(e),rnd=prng(+e.id+13),com=/ASESOR|VENDEDOR|EJECUTIVO|CAJER/.test(e.puesto),ing=parseYmd(e.ingreso),b=dOnly(baja),out=[];
 for(let k=12;k>=0;k--){
  const m0=new Date(b.getFullYear(),b.getMonth()-k,1),m1=new Date(m0.getFullYear(),m0.getMonth()+1,0);
  let amt=base*(1+(com?(rnd()-.4)*.2:(rnd()-.5)*.03));
  if(m1<ing)amt=0;else{let from=m0<ing?ing:m0,to=k===0?b:m1;amt=amt*Math.min(30,daysIncl(from,to))/30}
  out.push({m0,label:`${MESC[m0.getMonth()]}-${String(m0.getFullYear()).slice(2)}`,amt:r2(amt),cur:k===0});
 }
 return out;
}

function pctRule(c,motivo,causal,yf){
 const M=motivo||'',C=causal||'',b=yf<=1?0:yf<=5?1:yf<=10?2:yf<=15?3:4;
 const tipo=/^Renuncia|^Transferencia/.test(M)?'Voluntaria':'Inducida';
 if(c==='G'){
  if(/^Renuncia/.test(M))return C==='Jubilación'&&b>=2?{tipo,group:'regular',ind:R(0,100,true)}:{tipo,group:'sinMontos',ind:R(0,0,false)};
  if(/^Abandono/.test(M))return{tipo,group:'sinMontos',ind:R(0,0,false)};
  if(/^Transferencia/.test(M))return{tipo,group:'sinMontos',ind:R(0,0,false)};
  if(/trabajador$/.test(M))return{tipo,group:'regular',ind:b===0?R(35,35,true):R(100,100,true)};
  if(/^Fallecimiento/.test(M))return{tipo,group:'regular',ind:R(0,100,true)};
  return{tipo,group:'regular',ind:R(0,0,true)};
 }
 if(/^Renuncia/.test(M))return C==='Jubilación'?{tipo,group:'regular',pre:R(0,0,true),ces:b===4?R(35,35,true):R(0,0,true)}:{tipo,group:'sinMontos',pre:R(0,0,false),ces:R(0,0,false)};
 if(/^Abandono/.test(M))return{tipo,group:'sinMontos',pre:R(0,0,false),ces:R(0,0,false)};
 if(/^Transferencia/.test(M))return{tipo,group:'sinMontos',pre:R(0,0,true),ces:R(0,0,true)};
 if(/trabajador$/.test(M)){const x=b===0?R(0,35,true):R(0,100,true);return{tipo,group:'regular',pre:x,ces:{...x}}}
 if(/^Fallecimiento/.test(M))return{tipo,group:'regular',pre:R(0,0,true),ces:R(0,0,true)};
 if(/^Presentación/.test(C)){const v=[0,30,50,80,80][b];return{tipo,group:'regular',pre:R(v,v,true),ces:R(v,v,true)}}
 if(HN_B.some(k=>C.startsWith(k))){const mx=[70,70,70,80,90][b];return{tipo,group:'regular',pre:R(50,mx,true),ces:R(50,mx,true)}}

  L.push({k:'agui',l:'Aguinaldo (Decreto 76-78)',d:`Acumulado dic–nov ${money(c,aguiBase)} × 0.08333`,a:agui,in:'agui',inL:'Importe',money:true});
  L.push({k:'dpp',l:'Días pendientes de pago',d:`${+inp.dpp||0} días × ${money(c,salDia)}`,a:dppA,in:'dpp',inL:'Días'});

  L.push({k:'he',l:'Horas extras',d:'Importe reportado',a:he,in:'he',inL:'Importe',money:true});
  if(!SD)L.push({k:'ind',l:'Indemnización (Art. 82)',d:`${money(c,sdi)} × ${dias.toLocaleString('es-GT')} días = ${money(c,ind100)} al 100% × ${pct}%`,a:ind,pk:'pct',pv:pct,pr:rule.ind});
  T.push({l:'IGSS laboral 4.83% (días pendientes)',a:dppA*0.0483});
  T.push({l:'ISR 7% (días pendientes, vacaciones, variable y horas extras)',a:(dppA+vac+cv+he)*0.07});
 }else{
  const pP=pv('pctPre','pre'),pC=pv('pctCes','ces');anyPct=pP+pC;adicional=!SD&&(pP>rule.pre.max||pC>rule.ces.max);
  const last6=comp.slice(-6).filter(x=>x.amt>0),n6=Math.max(1,last6.length),sum6=last6.reduce((a,x)=>a+x.amt,0);
  const som=sum6/n6,sopm=som*14/12,spm=(sum6+(+inp.bono||0))/n6*14/12,somD=som/30,sopmD=sopm/30,spmD=spm/30;
  bases=[['S.O.M. (salario ordinario mensual)',som],['S.O.P.M. (×14/12)',sopm],['S.P.M. (con otras percepciones)',spm],['S.P.M. diario (÷30)',spmD]];
  const tm=A.y*12+A.m,preD=tm<3?1:tm<6?7:tm<12?14:A.y<2?30:60;
  let cesD=0,cesP=0;if(tm>=3&&tm<6)cesD=10;else if(tm>=6&&tm<12)cesD=20;else if(A.y>=1){cesD=Math.min(A.y,25)*30;cesP=A.y>=25?0:(A.m*30+A.d)/360*30}
  const jan=new Date(baja.getFullYear(),0,1),jul=new Date(baja.getMonth()>=6?baja.getFullYear():baja.getFullYear()-1,6,1);
  const aDays=d360(ing>jan?ing:jan,baja),cDays=d360(ing>jul?ing:jul,baja),aguiD=aDays/360*30,catD=cDays/360*30;

  if(!SD&&(rule.pre.edit||rule.pre.max>0))L.push({k:'pre',l:'Preaviso (Art. 120)',d:`${preD} días × ${money(c,spmD)} × ${pP}%`,a:preD*spmD*pP/100,pk:'pctPre',pv:pP,pr:rule.pre});

   if(cesP)L.push({k:'cesp',l:'Cesantía proporcional',d:`${cesP.toFixed(2)} días × ${money(c,spmD)} × ${pC}%`,a:cesP*spmD*pC/100});

  L.push({k:'cat',l:'Décimo cuarto mes (catorceavo) proporcional',d:`${cDays} días ÷ 360 × 30 = ${catD.toFixed(2)} días × ${money(c,somD)}`,a:inp.b14==null?catD*somD:+inp.b14,in:'b14',inL:'Importe',money:true});

 }
 L.forEach(x=>x.a=r2(x.a));T.forEach(x=>x.a=r2(x.a));

// Flujo de aprobación del finiquito (HU Aprobación + Reglas_Indemnizatorio_autorizaciones.xlsx)
function buildFinChain(fin){
 const f=F(fin.folio),e=EMPS[f.emp],c=e.pais,sol=f.sol,res=fin.res;
 const fs=EMPS[sol]&&EMPS[sol].formador&&EMPS[sol].formador!=='0'?EMPS[sol].formador:GENFI[c];
 const udn=e.udnF,dg=DGP[c];let r;
 if(res.mxn>=UMBRAL_MXN)r=[['FS',fs],['DCHPF',DCHP_F[c]],['UDNF',udn],['DG',dg],['PPL',PPL]];
 else if(res.adicional)r=udn===sol?[['FGF',e.fg],['DG',dg]]:[['FS',fs],['FGF',e.fg],['UDNF',udn],['DG',dg]];
 else if(res.group==='sinMontos')r=[['SOL',sol],['GENF',e.gen]];
 else r=udn===sol?[['GENF',e.gen],['DG',dg]]:[['FS',fs],['GENF',e.gen],['UDNF',udn]];
 r=r.filter(([,u])=>u!==fin.admin&&u!==e.id&&USERS[u]);
 const also={};r.forEach(([k,u],i)=>{if(r.slice(i+1).some(([,v])=>v===u))(also[u]=also[u]||[]).push(k)});
 r=r.filter(([,u],i)=>!r.slice(i+1).some(([,v])=>v===u));
 return r.map(([k,u],i)=>({u,r:k,st:i?'wait':'pend',...(k==='PPL'?{alts:PPL_ALT}:{}),...(also[u]?{also:also[u]}:{})}));
}
const finFlowLbl=res=>res.mxn>=UMBRAL_MXN?'Finiquito igual o mayor a 1 millón de pesos mexicanos':res.adicional?`Baja ${res.tipo.toLowerCase()} con montos indemnizatorios mayores a política`:res.group==='sinMontos'?`Baja ${res.tipo.toLowerCase()} sin montos indemnizatorios`:`Baja ${res.tipo.toLowerCase()} conforme a política`;
const finByFolio=id=>(S.fins||[]).find(x=>x.folio===+id);
const finById=id=>(S.fins||[]).find(x=>x.id===id);
const finCur=fin=>fin.chain?fin.chain.findIndex(c=>c.st==='pend'):-1;
const finPendFor=(u,c=S.country)=>(S.fins||[]).filter(x=>{if(x.status!=='auth')return false;const f=F(x.folio);if(EMPS[f.emp].pais!==c)return false;const k=finCur(x),it=x.chain[k];return it&&(it.u===u||(it.alts||[]).includes(u))});
function finRoles(u=S.session,c=S.country){
 const admin=FIN_ADMIN[c].includes(u),fadm=FIN_ADMIN_F[c].includes(u),legal=FIN_LEGAL[c].includes(u),sup=SUPER.includes(u);
 const gen=RAW.e.some(r=>String(r[10])===u&&r[11]===c);
 const apr=(S.fins||[]).some(x=>x.chain&&x.chain.some(it=>it.u===u||(it.alts||[]).includes(u)));
 return{admin,fadm,legal,sup,gen,apr,calc:admin||fadm,any:admin||fadm||legal||sup||gen||apr,sim:admin||fadm||legal||gen||sup};
}
function finVisible(f,R){if(R.calc||R.legal||R.sup)return true;const e=EMPS[f.emp];if(R.gen&&e.gen===S.session)return true;const fin=finByFolio(f.id);return !!(fin&&fin.chain&&fin.chain.some(it=>it.u===S.session||(it.alts||[]).includes(S.session)))}

function admApply(){
 const d=U.modal,j=(document.getElementById('aJust')?.value||'').trim(),isF=d.k==='fin',t=now().toISOString();d.j=j;
 const nuEl=document.getElementById('aNew');if(nuEl)d.nu=nuEl.value.trim();
 if(!j){toast('La justificación es obligatoria.');return}
 if((d.act==='reasig'||d.act==='regresa')&&d.step==null){toast('Selecciona un paso del flujo.');return}
 const fin=isF?finById(d.id):null,f=isF?F(fin.folio):F(d.id),ch=isF?fin.chain:f.chain;let msg='';
 if(isF&&FIN_LOCK.includes(fin.status)){toast('Finiquito contabilizado: no admite reversas.');return}
 const reopen=(k)=>{ch.forEach((it,i)=>{if(i>=k){it.st=i===k?'pend':'wait';delete it.f;delete it.j;delete it.by;delete it.auto;if(i===k)it.since=t}})};
 if(d.act==='reasig'){const nu=d.nu;if(!USERS[nu]){toast('El número de empleado no existe en la estructura.');return}if(nu===EMPS[f.emp].id){toast('El colaborador desvinculado no puede ser autorizante.');return}
  const it=ch[d.step];it.re={from:it.u,at:t,by:S.session,j};it.u=nu;msg=`Paso ${d.step+1} reasignado a ${USERS[nu].name}`}
 else if(d.act==='regresa'){if(!isF&&f.status!=='auth'){toast('Solo es posible regresar el flujo de solicitudes en autorización.');return}reopen(d.step);msg=`Flujo regresado al paso ${d.step+1} (reversa satelital)`}
 else if(d.act==='cancelar'&&!isF){f.status='cancel';ch.forEach(it=>{if(it.st==='pend'||it.st==='wait')it.st='na'});msg=`Solicitud cancelada (satelital)${f.bloqueo?' · el bloqueo de nómina permanece en SAP':''}`}
 else if(d.act==='reactivar'){if(S.folios.some(x=>x!==f&&x.emp===f.emp&&['auth','aplicada'].includes(x.status))){toast('El colaborador ya tiene otra solicitud activa o baja operativa: no es posible reactivar.');return}const k=ch.findIndex(it=>it.st!=='ok');f.status='auth';reopen(k<0?ch.length-1:k);msg='Solicitud reactivada'}
 else if(d.act==='motivo'){if(!d.mo||!d.ca){toast('Selecciona motivo y causal.');return}if(d.mo===f.motivo&&d.ca===f.causal){toast('Sin cambios.');return}
  f.motivoOrig=f.motivoOrig||{m:f.motivo,c:f.causal};const prev=`${f.motivo} · ${f.causal}`;f.motivo=d.mo;f.causal=d.ca;
  const fn=finByFolio(f.id);if(fn&&!FIN_LOCK.includes(fn.status)){fn.status='calc';delete fn.chain;fn.kit=null}
  msg=`Motivo y causal corregidos (antes: ${prev})${fn&&!FIN_LOCK.includes(fn.status)?' · finiquito por recalcular':''}`}
 else if(d.act==='reversar'){fin.status='calc';delete fin.chain;delete fin.contabAt;fin.kit=null;msg='Cálculo de finiquito reversado a estatus Calculado'}
 else if(d.act==='cancelar'&&isF){S.fins=S.fins.filter(x=>x!==fin);msg='Finiquito cancelado'}
 (isF?(fin.adm=fin.adm||[]):(f.adm=f.adm||[])).push({t,by:S.session,act:d.act,j,msg});
 logA('Administración',d.act==='motivo'?'Corrección satelital de motivo':msg.split(' (')[0],isF?fin.id:f.id,`${msg}. Justificación: ${j}`);save();U.modal=null;render();toast(msg+'.');
}

 if(ev.key==='Escape'){if(U.modal&&U.modal.t!=='load'&&U.modal.t!=='progress'){U.modal=null;renderLayer()}else if(U.guide){U.guide=false;renderLayer()}else if(U.notif||U.umenu){U.notif=U.umenu=false;render()}}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.mcard')){ev.preventDefault();ev.target.click()}
});
document.addEventListener('submit',ev=>{
 ev.preventDefault();const f=ev.target.dataset.f;
 if(f==='login')doLogin(document.getElementById('loginIn').value);
 else if(f==='solSearch')solSearch(document.getElementById('solQ').value);
 else if(f==='movSearch')movSearch_(document.getElementById('movQ').value);
 else if(f==='finGo'||f==='finSim'){finRoute(document.getElementById(f==='finGo'?'fgQ':'fsQ').value.trim());return}
 else if(f==='finSimOld'){const q=document.getElementById('fsQ').value.trim(),e=EMPS[q],R=finRoles(),sm=U.fin.sim;sm.q=q;if(!e){msg('Empleado fuera de la estructura','El número de empleado ingresado no pertenece a la estructura de países.',true,'warn');return}if(e.pais!==S.country){msg('Colaborador de otro país',`El colaborador labora en ${COUNTRY[e.pais].name}. Cambia de país para simular su finiquito.`,true,'warn');return}if(R.gen&&!R.calc&&!R.legal&&!R.sup&&e.gen!==S.session){msg('Sin permisos','Como Generalista solo puedes simular finiquitos de los colaboradores asociados a tu enlace BZ05.',true,'warn');return}(async()=>{await loader('Simulando finiquito','Calculando percepciones y deducciones...',800);sm.emp=q;U.fin.inpFor=null;render()})()}
});
document.addEventListener('input',ev=>{
 const k=ev.target.dataset.i;if(!k)return;const v=ev.target.value;
 if(k==='just'){U.sol.just=v;const c=document.getElementById('jc');if(c)c.textContent=v.length+'/500';if(U.sol.errs.just&&v.trim()){U.sol.errs.just=false;ev.target.classList.remove('err')}}
 else if(k==='dec'){U.mov.dec=v;const c=document.getElementById('dc');if(c)c.textContent=v.length+'/500';const er=document.getElementById('decErr');if(er&&v.trim()){er.hidden=true;ev.target.classList.remove('err')}}
 else if(k==='homeQ'){U.homeQ=v;const pos=ev.target.selectionStart;render();const i=document.querySelector('[data-i="homeQ"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}
 else if(k==='fq'){U.fin.q=v;const pos=ev.target.selectionStart;render();const i=document.querySelector('[data-i="fq"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}
 else if(k==='fdec'){U.fin.dec=v}
 else if(k==='pq'){U.mov.pq=v;const pos=ev.target.selectionStart;render();const i=document.querySelector('[data-i="pq"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',ev=>{
 const k=ev.target.dataset.i;
 if(k==='pdf'){const fl=ev.target.files&&ev.target.files[0];if(!fl)return;if(!/\.pdf$/i.test(fl.name)&&fl.type!=='application/pdf'){toast('El archivo debe ser PDF.');return}U.sol.pdf=fl.name;render();toast('Notificación de baja cargada.');return}
 if(k==='kit'){const fs=[...(ev.target.files||[])].map(x=>x.name);if(!fs.length)return;finKitUpload(fs);return}
 if(k==='motivo'){U.sol.motivo=ev.target.value;U.sol.causal='';U.sol.errs.motivo=false;render()}
 else if(k==='causal'){U.sol.causal=ev.target.value;U.sol.errs.causal=false;render()}
});
// mantener el valor del login al re-renderizar
document.addEventListener('keyup',ev=>{if(ev.target.id==='loginIn')U.loginVal=ev.target.value});

render();
if(S.session&&!S.country){U.loginUser=S.session;U.loginStep='country';render()}
if(S.session&&S.country){(async()=>{await loader('Validando acceso','Estamos verificando tu información...',900);render();const n=pendFor(S.session).length+finPendFor(S.session).length;if(n){U.modal={t:'np',n};renderLayer()}})()}
})();
</script>
</body>
</html>
