<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformando Juntos — Plataformas Capital Humano</title>
<meta name="description" content="Demo Day · Proyectos Capital Humano. Abre tu sobre y descubre las 3 plataformas.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://demodaych.github.io/">
<meta property="og:title" content="Transformando Juntos · Demo Day">
<meta property="og:description" content="Abre tu sobre y descubre las 3 plataformas de Capital Humano.">
<meta property="og:image" content="https://demodaych.github.io/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://demodaych.github.io/preview.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 116 130'%3E%3Cpath d='M58 3L112 34L112 96L58 127L4 96L4 34Z' fill='%23FFCD00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Open+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCD00;--y2:#F2BE00;--y3:#E0A800;--g:#2B2B2D;--g2:#3A3A3D;--g3:#5A5A5E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,Arial,sans-serif;color:var(--g);background:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg svg{width:100%;height:100%;opacity:.5;-webkit-mask-image:radial-gradient(circle at 0 0,#000,transparent 45%),radial-gradient(circle at 100% 100%,#000,transparent 50%);mask-image:radial-gradient(circle at 0 0,#000,transparent 45%),radial-gradient(circle at 100% 100%,#000,transparent 50%)}
.glow{position:fixed;left:50%;top:38%;width:900px;height:900px;max-width:160vw;max-height:160vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,205,0,.22),rgba(255,205,0,0) 62%);pointer-events:none;z-index:0;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 28px}
.head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.kicker{font-size:clamp(18px,3.4vw,24px);font-weight:500;margin:0}
.kicker b{font-weight:900;font-style:italic;background:linear-gradient(180deg,transparent 60%,#FFD84D 60%,#FFD84D 92%,transparent 92%)}
.title{width:min(520px,82vw);height:auto;display:block}
.sub{margin:4px 0 0;font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--g3)}

/* ---------- Escena 1: sobre ---------- */
.scene{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px 0}
.hint{margin:0;font-size:clamp(18px,3.6vw,24px);font-weight:600;text-align:center;line-height:1.35}
.hint b{font-weight:800}
.envbtn{all:unset;cursor:pointer;display:block;position:relative;border-radius:16px}
.envbtn:focus-visible{outline:3px solid var(--g);outline-offset:10px}
.env{--w:min(420px,84vw);width:var(--w);height:calc(var(--w)*.64);position:relative;perspective:1200px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-.6deg)}}
.env-back{position:absolute;inset:0;border-radius:14px;background:linear-gradient(180deg,#E9B400,#D9A400);box-shadow:0 30px 50px rgba(120,85,0,.25),0 6px 14px rgba(120,85,0,.18)}
.letter{position:absolute;z-index:2;left:7%;right:7%;top:8%;height:86%;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.letter img{width:78%;height:auto}
.letter span{font-size:clamp(11px,2.2vw,14px);font-weight:800;letter-spacing:.2em;color:var(--g3)}
.env-front{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#FFD633,var(--y) 55%,var(--y2));clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3}
.env-front:after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,rgba(0,0,0,.06) 0 49.8%,transparent 50%),linear-gradient(to top left,rgba(0,0,0,.06) 0 49.8%,transparent 50%)}
.flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:50% 0;z-index:4;transition:transform .7s cubic-bezier(.5,0,.3,1)}
.flap{filter:drop-shadow(0 6px 6px rgba(120,85,0,.28))}.flap i{position:absolute;inset:0;background:linear-gradient(180deg,#FFDA3D,#F5C200);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0}
.seal{position:absolute;left:50%;top:62%;width:clamp(64px,15vw,84px);aspect-ratio:116/130;transform:translate(-50%,-50%);z-index:6;transition:transform .35s ease,opacity .35s ease}
.seal svg{width:100%;height:100%;display:block}
.seal .shackle{transition:transform .3s ease;transform-origin:16px 11px}
.tap{position:absolute;right:-6%;bottom:-14%;width:58px;z-index:7;animation:tap 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-14px,-18px) scale(1)}55%{transform:translate(-14px,-18px) scale(.88)}70%{transform:translate(-14px,-18px) scale(1)}}

.open .env{animation:none}
.open .seal .shackle{transform:translateY(-4px) rotate(-25deg)}
.open .seal{transform:translate(-50%,-50%) scale(1.25);opacity:0;transition-delay:.25s}
.open .flap{transform:rotateX(180deg);transition-delay:.45s}
.open .flap.behind{z-index:1}
.open .letter{transform:translateY(-62%);transition-delay:1.05s}
.open .tap{display:none}
.scene.leave{animation:leave .6s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.9) translateY(-20px)}}

/* ---------- Escena 2: plataformas ---------- */
.reveal{display:none;flex:1;width:100%;max-width:1100px;flex-direction:column;align-items:center;gap:28px;padding:30px 0 10px}
.reveal.show{display:flex}
.reveal h2{margin:0;font-size:clamp(15px,2.6vw,19px);font-weight:800;letter-spacing:.26em;text-align:center}
.cards{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
@media (max-width:820px){.cards{grid-template-columns:minmax(0,1fr);max-width:440px}}
.card{background:#fff;border-radius:26px;padding:34px 26px 28px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 22px 46px rgba(60,60,60,.12),0 2px 6px rgba(60,60,60,.06);border:1px solid #EFEFF1;opacity:0;transform:perspective(900px) rotateY(-80deg) translateY(20px)}
.reveal.show .card{animation:cardin .8s cubic-bezier(.2,.8,.2,1) forwards}
.reveal.show .card:nth-child(2){animation-delay:.25s}
.reveal.show .card:nth-child(3){animation-delay:.5s}
@keyframes cardin{to{opacity:1;transform:none}}
.hex{position:relative;width:96px;height:108px}
.hex svg.h{position:absolute;inset:0;width:100%;height:100%}
.hex .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:24px;font-weight:900;font-style:italic}
.hex .lk .shackle{transform-origin:16px 11px;animation:unlock .5s ease forwards}
.card:nth-child(1) .lk .shackle{animation-delay:.9s}.card:nth-child(2) .lk .shackle{animation-delay:1.15s}.card:nth-child(3) .lk .shackle{animation-delay:1.4s}
@keyframes unlock{to{transform:translateY(-4px) rotate(-25deg)}}
.name{margin:0;font-size:clamp(30px,4vw,38px);font-weight:900;font-style:italic;letter-spacing:-.01em;text-align:center}
.name{min-height:64px;display:flex;align-items:center;justify-content:center}
.logo{display:block;width:auto;max-width:100%;height:auto;max-height:52px}
.card:nth-child(1) .logo{width:250px}.card:nth-child(2) .logo{width:220px}
.desp{display:inline-flex;align-items:center;padding:12px 26px 14px;border-radius:14px;background:#2A2A2C;color:#fff;font-family:"Segoe UI","Open Sans",Arial,sans-serif;font-weight:700;font-style:normal;font-size:36px;letter-spacing:-.01em;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.desp .d{color:#FFC21A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 26px;border-radius:999px;background:var(--y);color:var(--g);font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 8px 18px rgba(200,150,0,.28);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(200,150,0,.36);background:#FFD633}
.btn:focus-visible{outline:3px solid var(--g);outline-offset:3px}
.btn.pend{background:#EDEDEF;color:#5A5A5E;box-shadow:none;cursor:not-allowed}
.burst{position:fixed;left:50%;top:45%;width:0;height:0;z-index:5;pointer-events:none}
.burst span{position:absolute;width:14px;height:16px;background:var(--y);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:0;animation:fly 1.3s cubic-bezier(.15,.7,.3,1) forwards}
.burst span.d{background:var(--g2)}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}}
.again{all:unset;cursor:pointer;font-size:14px;font-weight:700;color:var(--g3);padding:10px 14px;border-radius:999px}
.again:hover{color:var(--g)}.again:focus-visible{outline:2px solid var(--g)}

footer{width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:18px;border-top:1px solid #EDEDEF;margin-top:10px}
footer p{margin:0;font-size:14px;line-height:1.5;color:var(--g3)}
footer p b{color:var(--g)}
footer img{width:118px;height:auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg><defs><pattern id="hx" width="56" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(1.3)"><path d="M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100" fill="none" stroke="#FFCD00" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#hx)"/></svg></div>
<div class="glow" aria-hidden="true"></div>

<main>
  <header class="head">
    <p class="kicker">Demo Day · <b>Proyectos Capital Humano</b></p>
    <img class="title" src="title_light.png" alt="Transformando Juntos">
  </header>

  <section class="scene" id="scene">
    <p class="hint">Tienes un sobre especial.<br><b>Tócalo para descubrir las 3 plataformas.</b></p>
    <button class="envbtn" id="envbtn" aria-label="Abrir el sobre">
      <div class="env">
        <div class="env-back"></div>
        <div class="letter"><img src="title_light.png" alt=""><span>3 PLATAFORMAS · 1 VISIÓN</span></div>
        <div class="env-front"></div>
        <div class="flap" id="flap"><i></i></div>
        <div class="seal">
          <svg viewBox="0 0 116 130" aria-hidden="true"><path d="M58 3L112 34L112 96L58 127L4 96L4 34Z" fill="#3A3A3D" stroke="#2B2B2D" stroke-width="3"/>
            <g transform="translate(40 40) scale(1.5)" fill="none" stroke="#FFCD00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
          </svg>
        </div>
        <svg class="tap" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#2B2B2D" stroke="#2B2B2D" stroke-width="5" stroke-linejoin="round"><rect x="22" y="4" width="11" height="34" rx="5.5"/><rect x="32" y="22" width="9" height="16" rx="4.5"/><rect x="40" y="24" width="9" height="16" rx="4.5"/><rect x="48" y="27" width="8" height="15" rx="4"/><rect x="16" y="28" width="40" height="30" rx="11"/><rect x="9" y="30" width="11" height="20" rx="5.5" transform="rotate(-25 14 40)"/></g>
          <g fill="#fff"><rect x="22" y="4" width="11" height="34" rx="5.5"/><rect x="32" y="22" width="9" height="16" rx="4.5"/><rect x="40" y="24" width="9" height="16" rx="4.5"/><rect x="48" y="27" width="8" height="15" rx="4"/><rect x="16" y="28" width="40" height="30" rx="11"/><rect x="9" y="30" width="11" height="20" rx="5.5" transform="rotate(-25 14 40)"/></g>
          <path d="M33 30v6M41 32v6M49 34v5" stroke="#2B2B2D" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
    </button>
  </section>

  <section class="reveal" id="reveal" aria-live="polite">
    <h2>3 PLATAFORMAS · 1 VISIÓN</h2>
    <div class="cards" id="cards"></div>
    <button class="again" id="again">↺ Ver de nuevo</button>
  </section>

  <footer>
    <p><b>Demo Day</b> · Miércoles 18 de noviembre · 3:00 p.m.<br>Sala de Juntas Visión, Corporativo SPS</p>
    <img src="logo_light.png" alt="Grupo Salinas, desde 1906">
  </footer>
</main>
<div class="burst" id="burst" aria-hidden="true"></div>

<script>
/* Enlaces de cada plataforma: pega aquí cada URL */
const PLATAFORMAS = [
  { num: "01", nombre: "Compensalia", url: "https://qrco.de/bh2K22",                   logo: "img/compensalia.png" },
  { num: "02", nombre: "Reclutalia",  url: "https://reclutalia-demo-hn.firebaseapp.com/", logo: "img/reclutalia.png" },
  { num: "03", nombre: "Despidalia",  url: "https://demodaych.github.io/despidalia/",   logo: "" }
];

const lockSVG = (stroke) => `<svg class="lk" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
const cards = document.getElementById('cards');
cards.innerHTML = PLATAFORMAS.map((p, i) => {
  const dark = i === 1;
  const fill = dark ? '#3A3A3D' : '#FFCD00';
  const fg = dark ? '#FFFFFF' : '#2B2B2D';
  const lk = dark ? '#FFCD00' : '#2B2B2D';
  const btn = p.url
    ? `<a class="btn" href="${p.url}" target="_blank" rel="noopener">Conocer plataforma <span aria-hidden="true">→</span></a>`
    : `<span class="btn pend" role="link" aria-disabled="true">Enlace pendiente</span>`;
  return `<article class="card">
    <div class="hex"><svg class="h" viewBox="0 0 116 130" aria-hidden="true"><path d="M58 3L112 34L112 96L58 127L4 96L4 34Z" fill="${fill}"/></svg>
      <div class="in" style="color:${fg}">${lockSVG(lk)}<span>${p.num}</span></div></div>
    <h3 class="name">${p.logo ? `<img class="logo" src="${p.logo}" alt="${p.nombre}">` : `<span class="desp" role="img" aria-label="${p.nombre}"><span class="d">${p.nombre[0]}</span>${p.nombre.slice(1)}</span>`}</h3>
    ${btn}
  </article>`;
}).join('');

const scene = document.getElementById('scene'), reveal = document.getElementById('reveal');
const envbtn = document.getElementById('envbtn'), flap = document.getElementById('flap');
const burst = document.getElementById('burst');
let opened = false;
function doBurst(){
  burst.innerHTML = '';
  for (let k = 0; k < 28; k++){
    const s = document.createElement('span');
    const a = Math.random() * Math.PI * 2, d = 160 + Math.random() * 260;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    s.style.animationDelay = (Math.random() * .15) + 's';
    if (k % 3 === 0) s.className = 'd';
    burst.appendChild(s);
  }
}
envbtn.addEventListener('click', () => {
  if (opened) return; opened = true;
  scene.classList.add('open');
  setTimeout(() => flap.classList.add('behind'), 800);
  setTimeout(() => scene.classList.add('leave'), 2100);
  setTimeout(() => {
    scene.style.display = 'none';
    reveal.classList.add('show');
    doBurst();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 2650);
});
document.getElementById('again').addEventListener('click', () => {
  opened = false;
  reveal.classList.remove('show');
  scene.classList.remove('open', 'leave');
  flap.classList.remove('behind');
  scene.style.display = '';
  burst.innerHTML = '';
});
</script>
</body>
</html>
