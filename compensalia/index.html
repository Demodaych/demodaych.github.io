.week{text-align:center;padding:10px 6px}

hr{border:0;border-top:1.5px solid #555;margin:12px 30px}

.pill{display:block;margin:14px auto;background:#fff;border:0;border-radius:24px;padding:8px 22px;font:500 20px Poppins,sans-serif;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chip{display:block;width:max-content;margin:12px auto;background:var(--yellow);border-radius:20px;padding:4px 20px;font-weight:700;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:10.5px;background:#fff}
th{background:var(--yellow);padding:7px 4px;font-weight:500}
td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}

.lbls{display:flex;gap:6px;font-size:8.5px;color:#555}

.niveles{animation:nivin .35s ease}

.screen{overflow-x:hidden}
.star{height:38px;border-radius:6px;display:grid;place-items:center;font-size:22px;margin:8px 0}
.ind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ind .a{text-align:center;font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:6px;border-radius:6px}
.ind .a:hover{background:#fff}
.ind .b{background:#fff;border-radius:4px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:12px;font-weight:600;padding:8px;min-height:70px}
.red{background:var(--red);color:#fff;border-radius:4px;padding:12px;text-align:center;font-weight:600}
.watermark{background-image:radial-gradient(circle at 20% 15%,rgba(252,213,74,.25) 0 30px,transparent 31px),radial-gradient(circle at 85% 40%,rgba(252,213,74,.2) 0 20px,transparent 21px)}
.loading{position:absolute;inset:0;background:#fff;display:grid;place-items:center;z-index:5}
.loading::after{content:"";width:22px;height:22px;border:2px solid #ccc;border-top-color:#555;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading::after{animation:none}}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 22px;gap:14px}
.login .logo{margin:0 0 4px}
.login h2{margin:0}
.login p.lead{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.login label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600}
.login input{font:500 14px Poppins,sans-serif;padding:11px 12px;border:1.5px solid #d6d6d6;border-radius:8px;background:#fff;color:var(--ink);min-height:44px}
.login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,60,240,.15)}
.login .pw{position:relative;display:flex;width:100%}
.login .pw input{flex:1;min-width:0;width:100%;padding-right:76px}
.login .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font:600 11px Poppins,sans-serif;color:var(--blue);cursor:pointer;padding:8px;min-height:36px}
.login .enter{margin-top:4px;background:var(--blue);color:#fff;border:0;border-radius:24px;padding:12px;font:600 15px Poppins,sans-serif;cursor:pointer;min-height:46px}
.login .enter:hover{background:#2030d8}
.login .err{display:none;background:#fde8e7;color:#b3261e;border-radius:8px;padding:9px 11px;font-size:11.5px;font-weight:600;text-align:center}
.login .err.show{display:block}
.login .note{font-size:10.5px;color:var(--muted);text-align:center;margin:0}
button:focus-visible,.go:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>

let cur='home';
function render(name,scroll){
  cur=name;S.innerHTML=screens[name]();
  S.className='screen'+(['escalafon','vind','veq','intereses','calidad','perdidos','nuevos','captacion'].includes(name)?' gray':'');
  S.scrollTop=scroll||0;
  if(name==='login') bindLogin();
  const q=document.getElementById('q');
  if(q){q.focus();q.oninput=()=>{const t=q.value.toLowerCase();document.querySelectorAll('[data-pick-emp]').forEach(d=>d.hidden=!d.textContent.toLowerCase().includes(t));};}
}
function bindLogin(){
  const f=document.getElementById('loginForm'),u=document.getElementById('lgUser'),pw=document.getElementById('lgPass'),er=document.getElementById('lgErr'),eye=document.getElementById('lgEye');
  eye.onclick=()=>{const sh=pw.type==='password';pw.type=sh?'text':'password';eye.textContent=sh?'Ocultar':'Mostrar';eye.setAttribute('aria-label',sh?'Ocultar contraseña':'Mostrar contraseña');};
  f.onsubmit=e=>{
    e.preventDefault();
    const mail=u.value.trim().toLowerCase(), clave=pw.value;
    er.classList.remove('show');
    if(!mail||!clave){er.textContent='Ingresa tu correo y tu contraseña.';er.classList.add('show');return;}
    if(!USUARIOS.includes(mail)){er.textContent='Este correo no tiene acceso a la demo.';er.classList.add('show');u.focus();return;}
    if(clave!==CLAVE){er.textContent='La contraseña es incorrecta.';er.classList.add('show');pw.value='';pw.focus();return;}
    AUTH=true; try{sessionStorage.setItem('comp_auth','1');}catch(err){}
    const ld=document.createElement('div');ld.className='loading';S.appendChild(ld);
    setTimeout(()=>render('home'),500);
  };
  u.focus();
}
function go(name){
  const ld=document.createElement('div');ld.className='loading';S.appendChild(ld);
  stack.push({name:cur,scroll:S.scrollTop});
  setTimeout(()=>render(name),350);
}
S.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-back],[data-act],[data-pick-emp],[data-pick-week]');if(!t)return;
  if(t.dataset.go){if(t.dataset.ped){e.preventDefault();state.pedido=+t.dataset.ped;}return go(t.dataset.go);}
  if(t.hasAttribute('data-back')){const p=stack.pop();return render(p?p.name:'home',p?p.scroll:0);}
  const sc=S.scrollTop;
  if(t.dataset.act==='niveles'){state.niveles=!state.niveles;return render(cur,sc);}
  if(t.dataset.act==='emp'){if(state.emp&&e.target.textContent==='✕'){state.emp=state.week=null;state.open=null;stack.length=0;return render('home');}state.open=state.open==='emp'?null:'emp';return render(cur,sc);}
  if(t.dataset.act==='week'){if(state.week&&e.target.textContent==='✕'){state.week=null;state.open=null;stack.length=0;return render('home');}state.open=state.open==='week'?null:'week';return render(cur,sc);}
  if(t.dataset.pickEmp){state.emp=t.dataset.pickEmp;state.open='week';return render(cur,sc);}
  if(t.dataset.pickWeek){state.week=t.dataset.pickWeek;state.open=null;stack.length=0;const ld=document.createElement('div');ld.className='loading';S.appendChild(ld);setTimeout(()=>render('home'),450);}
});
S.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))go(e.target.dataset.go);});
render(AUTH?'home':'login');
